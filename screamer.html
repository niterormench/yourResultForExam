<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Результаты теста по культурологии</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 50px;
      background-color: #1a1a1a;
      color: #ffffff;
      margin: 0;
    }

    button {
      padding: 10px 20px;
      font-size: 1rem;
      margin: 10px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #333;
      color: #fff;
    }

    button:disabled {
      background-color: #666;
      cursor: not-allowed;
    }

    button:hover:enabled {
      background-color: #555;
    }

    input[type="text"] {
      padding: 10px;
      font-size: 1rem;
      border-radius: 5px;
      border: none;
      margin-bottom: 10px;
      width: 250px;
      max-width: 90%;
      text-align: center;
    }

    #screamer {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.95);
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: white;
      font-size: 4rem;
      font-weight: bold;
    }

    #result {
      font-size: 0.7rem; /* very small font */
      margin-top: 20px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Start Screen -->
  <div id="startScreen">
    <h1>Культурология 2025 1 Курс</h1>
    <p>Введите ваш student ID</p>
    <button id="startButton">Поиск</button>
  </div>

  <!-- Main Game -->
  <div id="game" style="display:none;">
    <h1>Random Number Generator</h1>

    <input type="text" id="studentId" placeholder="Enter your Student ID" />

    <br />

    <button id="generateBtn" disabled>Generate Number</button>

    <p id="result"></p>
  </div>

  <!-- Screamer Overlay -->
  <div id="screamer">
    <img src="./WhatsApp Image 2025-04-19 at 11.43.36_ca15923c.jpg" alt="">
    <audio id="screamSound" src="https://www.myinstants.com/media/sounds/movie_1.mp3" preload="auto"></audio>
  </div>

  <script>
    const startButton = document.getElementById("startButton");
    const game = document.getElementById("game");
    const startScreen = document.getElementById("startScreen");
    const screamSound = document.getElementById("screamSound");

    const studentIdInput = document.getElementById("studentId");
    const generateBtn = document.getElementById("generateBtn");
    const result = document.getElementById("result");
    const screamer = document.getElementById("screamer");

    startButton.addEventListener("click", () => {
      // Unlock audio on first user gesture
      screamSound.play().then(() => screamSound.pause());
      startScreen.style.display = "none";
      game.style.display = "block";
      studentIdInput.focus();
    });

studentIdInput.addEventListener("input", () => {
  const val = studentIdInput.value.trim();
  const isValid = /^\d{6}$/.test(val); // exactly 6 digits
  generateBtn.disabled = !isValid;
});

    generateBtn.addEventListener("click", () => {
      const number = Math.floor(Math.random() * (100 - 40 + 1)) + 40; // 40 to 100

      // Show number in very small font
      result.style.display = "block";
      result.textContent = `Student ID: ${studentIdInput.value.trim()} — You got: ${number}`;

      // After 2 seconds, show screamer regardless of number
      setTimeout(() => {
        screamer.style.display = "flex";
        screamSound.currentTime = 0;
        screamSound.play();

        setTimeout(() => {
          screamer.style.display = "none";
        }, 3000);
      }, 2000);
    });
  </script>

</body>
</html>
